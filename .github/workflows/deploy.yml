# Builds the static export and publishes it to the Hetzner server, where it
# is served by nginx behind the server's Traefik (see deploy/).
#
# The upload uses a key that can do one thing: rsync into /opt/kera/site, as
# the unprivileged kera-deploy user. It cannot open a shell, read anything
# else, or touch the Damla Group app that shares the server.
#
# Secrets: KERA_DEPLOY_KEY (that private key) and KERA_KNOWN_HOSTS (the
# server's host key, so the upload refuses an impostor).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER: 95.216.162.140
  SITE: www.kera.brussels

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Playwright is a dev tool for the screenshot scripts; CI never opens
          # a browser, so skip the ~150 MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ env.SITE }}

      - name: Fail if the page does not name its real address
        run: |
          if ! grep -q "rel=\"canonical\" href=\"https://${SITE}/\"" out/index.html; then
            echo "::error::out/index.html does not carry the canonical https://${SITE}/."
            exit 1
          fi

      - name: Upload to the server
        env:
          KEY: ${{ secrets.KERA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KERA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/kera && chmod 600 ~/.ssh/kera
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delay-updates swaps the new files in together at the end, so a
          # visitor mid-deploy does not get a page whose bundles are half there
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/kera -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            out/ "kera-deploy@${SERVER}:/"

      - name: Check the server is serving this build
        run: |
          want=$(grep -o '/_next/static/chunks/app/page-[^"]*\.js' out/index.html | head -1)
          # straight to the server, so this works before DNS points there too
          got=$(curl -sfk --resolve "${SITE}:443:${SERVER}" "https://${SITE}/")
          echo "$got" | grep -q "$want" || { echo "::error::The server is not serving this build."; exit 1; }
          curl -sfk -o /dev/null --resolve "${SITE}:443:${SERVER}" "https://${SITE}${want}"
          echo "Live: https://${SITE}/"
