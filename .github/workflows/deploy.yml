# Builds the static export and publishes it to GitHub Pages.
#
# The site is a Next.js static export, so there is no server to run — Pages
# serves the contents of out/ directly. The only subtlety is the base path:
# a project repo is served from https://<user>.github.io/<repo>/, so every
# absolute asset URL needs that prefix. configure-pages works it out and the
# build reads it through NEXT_PUBLIC_BASE_PATH (see lib/paths.ts). Add a
# custom domain later and the same job produces root-relative URLs instead —
# nothing here needs editing.
#
# The prefix is the repo name, case and all, and it is fixed at build time.
# Renaming the repo leaves the last build pointing at the old name, so run
# this workflow by hand (workflow_dispatch) straight after a rename.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deploy job is allowed to touch.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win, but don't cancel a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the Pages URL and base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci
        env:
          # Playwright is a dev tool for the screenshot scripts; CI never opens
          # a browser, so skip the ~150 MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Tell Pages not to run Jekyll over _next/
        run: touch out/.nojekyll

      - name: Fail if the base path did not reach the markup
        run: |
          expected='${{ steps.pages.outputs.base_path }}'
          expected="${expected%/}"
          if ! grep -q "src=\"${expected}/img/ridge.jpg\"" out/index.html; then
            echo "::error::Assets are not prefixed with '${expected}'. Images will 404 on Pages."
            grep -o 'src="[^"]*ridge[^"]*"' out/index.html | head -1
            exit 1
          fi
          echo "Assets correctly prefixed with '${expected:-<root>}'."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
