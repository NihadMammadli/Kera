# Serves the static export (out/) behind the server's Traefik, which owns
# ports 80/443 and terminates TLS. This file is mounted read-only into the
# container by deploy/docker-compose.yml.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Traefik nginx only ever sees http on port 80; an absolute redirect
  # (/menu → http://host:80/menu/) would leak that. Relative ones do not.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # `expires` rather than add_header for caching: an add_header inside a
  # location would silently drop the security headers above.

  # Next's hashed bundles never change under the same name.
  location /_next/static/ {
    expires 1y;
    try_files $uri =404;
  }

  # Pictures are renamed when they change (npm run images), so a month is safe.
  location /img/ {
    expires 30d;
    try_files $uri =404;
  }

  # The page itself is always checked, so a deploy shows up on the next visit.
  location / {
    expires -1;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
